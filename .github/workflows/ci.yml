name: Cartographer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Public boundary audit
        run: python scripts/public_boundary_audit.py --check-ignore-policy
      - name: Public boundary adversarial tests
        run: python tests/public_boundary_audit_tests.py -v
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCARTO_BUILD_TESTS=ON -DCARTO_BUILD_CLI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Public boundary audit
        run: python scripts/public_boundary_audit.py --check-ignore-policy
      - name: Public boundary adversarial tests
        run: python tests/public_boundary_audit_tests.py -v
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCARTO_BUILD_TESTS=ON -DCARTO_BUILD_CLI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
